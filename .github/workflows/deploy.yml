name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for OIDC authentication
  contents: read

jobs:
  build-test:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest
    # Some tests are integration tests that hit a local DynamoDB at
    # localhost:8000 (LOCAL_DDB). Provide it as a service container.
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap local DynamoDB tables
        run: npm run ddb:bootstrap
        # The CI dynamodb-local has no -sharedDb, so it partitions tables by
        # region+creds. Tests run in us-east-1, so bootstrap must match (the
        # script otherwise defaults to us-west-2).
        env:
          AWS_REGION: us-east-1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage floors)
        run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (Playwright)
        # Keyless: with no provider API keys, completions fall back to a
        # mocked response (lib/providers.ts), so the smoke test costs nothing.
        run: npm run test:e2e
        env:
          LOCAL_DDB: 'true'
          DDB_ENDPOINT: http://localhost:8000
          AWS_REGION: us-east-1

  deploy:
    name: Deploy to AWS
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build OpenNext bundle
        run: npm run build:opennext
        env:
          APP_BASE_URL: https://chat.hectoragomez.com

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install CDK deps
        run: npm ci
        working-directory: infra

      - name: CDK deploy
        run: npx cdk deploy --require-approval never
        working-directory: infra
